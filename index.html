<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #F7F4EC;
      --paper-card: #FFFFFF;
      --ink: #1F2B24;
      --ink-soft: #5B6960;
      --line: #E1DACB;
      --green: #2F6F4E;
      --green-soft: #E5EFE7;
      --rust: #B5533C;
      --rust-soft: #F7E9E4;
      --gold: #B78E3E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      padding: 24px 16px 60px;
      max-width: 560px;
      margin-inline: auto;
    }

    header {
      margin-bottom: 24px;
    }

    header p.eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 4px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .saldos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .saldo-card.total {
      background: var(--green-soft);
      border-color: var(--green);
    }

    .saldo-card {
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .saldo-card .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin: 0 0 6px;
    }

    .saldo-card .valor {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      margin: 0;
    }

    section {
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    section h2 {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 14px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input,
    select {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      width: 100%;
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--green);
      outline-offset: 1px;
    }

    button[type="submit"] {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      margin-top: 4px;
    }

    button[type="submit"]:hover {
      background: #275c40;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-soft);
      font-weight: 500;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    td.num {
      text-align: right;
    }

    .num.ok {
      color: var(--green);
    }

    .num.bad {
      color: var(--rust);
    }

    ul#lista {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    ul#lista li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .mov-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mov-nombre {
      font-size: 14px;
      font-weight: 500;
    }

    .mov-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .mov-derecha {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mov-monto {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 14px;
    }

    .pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .pill.ingreso {
      background: var(--green-soft);
      color: var(--green);
    }

    .pill.gasto {
      background: var(--rust-soft);
      color: var(--rust);
    }

    .borrar {
      background: none;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
    }

    .borrar:hover {
      color: var(--rust);
    }

    .vacio {
      font-size: 13px;
      color: var(--ink-soft);
      text-align: center;
      padding: 16px 0;
    }

    select#filtroMes {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <header>
    <p class="eyebrow">Registro diario</p>
    <h1>Mis Finanzas</h1>
  </header>

  <div class="saldos">
    <div class="saldo-card total">
      <p class="label">💰 Total</p>
      <p class="valor" id="saldoTotal">$0</p>
    </div>
    <div class="saldo-card">
      <p class="label">💵 Efectivo</p>
      <p class="valor" id="saldoEfectivo">$0</p>
    </div>
    <div class="saldo-card">
      <p class="label">💳 Tarjeta</p>
      <p class="valor" id="saldoTarjeta">$0</p>
    </div>
  </div>

  <section>
    <h2>Agregar movimiento</h2>
    <form id="formulario">
      <input type="text" id="nombre" placeholder="¿Qué es? (ej. venta de galletas)" required>

      <div class="fila">
        <input type="number" id="monto" placeholder="Monto" step="0.01" min="0.01" required>
        <select id="tipo">
          <option value="ingreso">Ingreso</option>
          <option value="gasto">Gasto</option>
        </select>
      </div>

      <div class="fila">
        <select id="cuenta">
          <option value="efectivo">Efectivo</option>
          <option value="tarjeta">Tarjeta</option>
        </select>
        <select id="negocio">
          <option value="galletas">Galletas</option>
          <option value="autos">Lavado de autos</option>
          <option value="perros">Paseo de perros</option>
          <option value="personal">Personal</option>
        </select>
      </div>

      <select id="categoria">
        <option value="">Categoría del gasto</option>
        <option value="Gastos fijos">Gastos fijos</option>
        <option value="Salidas y comida">Salidas y comida</option>
        <option value="Ropa">Ropa</option>
        <option value="Escuela">Escuela</option>
        <option value="Regalos">Regalos</option>
        <option value="Boberías">Boberías</option>
        <option value="Otros">Otros</option>
      </select>

      <button type="submit">Agregar</button>
    </form>
  </section>

  <section>
    <h2>Resumen del mes por negocio</h2>
    <table>
      <thead>
        <tr>
          <th>Negocio</th>
          <th class="num">Ingresos</th>
          <th class="num">Gastos</th>
          <th class="num">Neto</th>
        </tr>
      </thead>
      <tbody id="resumenBody"></tbody>
    </table>
  </section>

  <section>
  <h2>Gastos personales del mes por categoría</h2>
  <table>
    <thead>
      <tr>
        <th>Categoría</th>
        <th class="num">Gastado</th>
      </tr>
    </thead>
    <tbody id="categoriasBody"></tbody>
  </table>
  </section> 


  <section>
    <h2>Movimientos recientes</h2>
    <ul id="lista"></ul>
  </section>

  <script>
    const NEGOCIOS = {
      galletas: 'Galletas',
      autos: 'Lavado de autos',
      perros: 'Paseo de perros',
      personal: 'Personal'
    };

    const API_URL = 'https://script.google.com/macros/s/AKfycbzUHukoR7rXauKvcG58s1vzBlDF5gCaGJTA8SSKFKlAa52mW2OcUm4MVup_L1EHrRGN-Q/exec';

    let movimientos = [];

    async function cargarMovimientos() {
      try {
        const res = await fetch(API_URL);
        const datos = await res.json();
        movimientos = datos.map(m => ({ ...m, monto: parseFloat(m.monto) }));
      } catch (err) {
        console.error('No se pudo cargar desde el backend:', err);
      }
      render();
    }

    async function guardarEnBackend(mov) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(mov)
        });
      } catch (err) {
        console.error('No se pudo guardar en el backend:', err);
      }
    }

    const form = document.getElementById('formulario');
    const tipoSelect = document.getElementById('tipo');
    const categoriaSelect = document.getElementById('categoria');

    function actualizarCategoria() {
  const esGasto = tipoSelect.value === 'gasto';
  categoriaSelect.style.display = esGasto ? 'block' : 'none';
  categoriaSelect.required = esGasto;
}

    tipoSelect.addEventListener('change', actualizarCategoria);
    actualizarCategoria();
    const lista = document.getElementById('lista');
    const resumenBody = document.getElementById('resumenBody');
    const saldoEfectivoEl = document.getElementById('saldoEfectivo');
    const saldoTarjetaEl = document.getElementById('saldoTarjeta');

    function formatoMoneda(n) {
      return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calcularSaldos() {
      let efectivo = 0, tarjeta = 0;
      movimientos.forEach(m => {
        const signo = m.tipo === 'ingreso' ? 1 : -1;
        if (m.cuenta === 'efectivo') efectivo += signo * m.monto;
        else tarjeta += signo * m.monto;
      });
      return { efectivo, tarjeta };
    }

    function calcularResumenMes() {
      const ahora = new Date();
      const mesActual = ahora.getMonth();
      const anioActual = ahora.getFullYear();

      const resumen = {};
      Object.keys(NEGOCIOS).forEach(key => {
        resumen[key] = { ingreso: 0, gasto: 0 };
      });

      movimientos.forEach(m => {
        const fecha = new Date(m.fecha);
        if (fecha.getMonth() === mesActual && fecha.getFullYear() === anioActual) {
          resumen[m.negocio][m.tipo] += m.monto;
        }
      });

      return resumen;
    }
function calcularResumenCategorias() {
  const ahora = new Date();
  const totales = {};

  movimientos.forEach(m => {
    if (m.tipo !== 'gasto' || m.negocio !== 'personal') return;
    const fecha = new Date(m.fecha);
    if (fecha.getMonth() !== ahora.getMonth() || fecha.getFullYear() !== ahora.getFullYear()) return;
    const cat = m.categoria || 'Sin categoría';
    totales[cat] = (totales[cat] || 0) + m.monto;
  });

  return totales;
}

    function render() {
      // Saldos
      const { efectivo, tarjeta } = calcularSaldos();
      const total = efectivo + tarjeta;
      document.getElementById('saldoTotal').textContent = formatoMoneda(total);
      saldoEfectivoEl.textContent = formatoMoneda(efectivo);
      saldoTarjetaEl.textContent = formatoMoneda(tarjeta);

      // Resumen por negocio
      const resumen = calcularResumenMes();
      resumenBody.innerHTML = '';
      Object.keys(NEGOCIOS).forEach(key => {
        const r = resumen[key];
        const neto = r.ingreso - r.gasto;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${NEGOCIOS[key]}</td>
          <td class="num ok">${formatoMoneda(r.ingreso)}</td>
          <td class="num bad">${formatoMoneda(r.gasto)}</td>
          <td class="num ${neto >= 0 ? 'ok' : 'bad'}">${formatoMoneda(neto)}</td>
        `;
        resumenBody.appendChild(tr);
      });

      // Resumen por categoría
const categorias = calcularResumenCategorias();
const categoriasBody = document.getElementById('categoriasBody');
categoriasBody.innerHTML = '';
const filasCat = Object.entries(categorias).sort((a, b) => b[1] - a[1]);

if (filasCat.length === 0) {
  categoriasBody.innerHTML = '<tr><td colspan="2">Todavía no hay gastos este mes.</td></tr>';
}

filasCat.forEach(([cat, total]) => {
  const fila = document.createElement('tr');
  fila.innerHTML = `<td>${cat}</td><td class="num bad">${formatoMoneda(total)}</td>`;
  categoriasBody.appendChild(fila);
});

// Lista de movimientos (más recientes primero)
      lista.innerHTML = '';
      if (movimientos.length === 0) {
        lista.innerHTML = '<p class="vacio">Todavía no hay movimientos. Agrega el primero arriba.</p>';
        return;
      }

      const ordenados = [...movimientos].reverse();
      ordenados.forEach(m => {
        const li = document.createElement('li');
        const fecha = new Date(m.fecha).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
        li.innerHTML = `
          <div class="mov-info">
            <span class="mov-nombre">${m.nombre}</span>
            <span class="mov-meta">${NEGOCIOS[m.negocio]} · ${m.cuenta} · ${fecha}</span>
          </div>
          <div class="mov-derecha">
            <span class="pill ${m.tipo}">${m.tipo}</span>
            <span class="mov-monto">${formatoMoneda(m.monto)}</span>
            <button class="borrar" data-id="${m.id}" title="Borrar">✕</button>
          </div>
        `;
        lista.appendChild(li);
      });

      // Botones de borrar
      document.querySelectorAll('.borrar').forEach(btn => {
        btn.addEventListener('click', () => eliminarMovimiento(btn.getAttribute('data-id')));
      });
    }

    async function eliminarMovimiento(id) {
      // Actualización optimista: lo quitamos de la pantalla de inmediato
      movimientos = movimientos.filter(m => String(m.id) !== String(id));
      render();

      // Y le avisamos al backend que borre esa fila del Sheet
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accion: 'borrar', id })
        });
      } catch (err) {
        console.error('No se pudo borrar en el backend:', err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const monto = parseFloat(document.getElementById('monto').value);
      const tipo = document.getElementById('tipo').value;
      const cuenta = document.getElementById('cuenta').value;
      const negocio = document.getElementById('negocio').value;
      const categoria = tipo === 'gasto' ? document.getElementById('categoria').value : '';

      if (!nombre || isNaN(monto) || monto <= 0) return;

      const nuevoMovimiento = {
        id: Date.now(),
        nombre,
        monto,
        tipo,
        cuenta,
        negocio,
        categoria,
        fecha: new Date().toISOString()
      };

      // Actualización optimista: lo mostramos de inmediato sin esperar al servidor
      movimientos.push(nuevoMovimiento);
      render();
      form.reset();
      actualizarCategoria();
      document.getElementById('nombre').focus();

      // Y en paralelo lo mandamos a guardar de verdad en el Sheet
      await guardarEnBackend(nuevoMovimiento);
    });

    cargarMovimientos();
  </script>

</body>

</html>
